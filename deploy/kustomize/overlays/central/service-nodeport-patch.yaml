# Expose the gateway on a fixed NodePort like the regional apiservers.
# 30180 verified free on the central cluster (kubernetes-2080).
# Written as JSON 6902 ops because strategic-merge list patches do not
# merge into Service.spec.ports with the kustomize bundled in kubectl
# 1.29 (v5.0.4).
- op: add
  path: /spec/type
  value: NodePort
- op: add
  path: /spec/ports/0/nodePort
  value: 30180
