apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-core-service
  namespace: aiplatform-core-gateway
  labels:
    app: pipeline-core-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipeline-core-service
  template:
    metadata:
      labels:
        app: pipeline-core-service
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      serviceAccountName: pipeline-core-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pipeline-core-service
        image: harbor-local.aiplatformdev.freeddns.org/ai-platform/pipeline/pipeline-core-service:placeholder
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"
        - name: REGIONS_CONFIG_PATH
          value: /etc/core-gateway/regions.json
        - name: HEALTH_CHECK_INTERVAL_SECONDS
          value: "30"
        # Sensitive values from the gateway-secrets Secret.
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: pipeline-core-gateway-secrets
              key: database-url
        - name: SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: pipeline-core-gateway-secrets
              key: service-key
        # Feature flags — safe to expose in the ConfigMap / env directly.
        - name: ENFORCER_REQUIRED
          value: "true"
        - name: NAMESPACE_CACHE_TTL_SECONDS
          value: "60"
        - name: PROVISION_RECONCILE_INTERVAL_SECONDS
          value: "30"
        - name: REGIONS_EXPOSE_ENDPOINTS
          value: "false"
        volumeMounts:
        - name: regions-config
          mountPath: /etc/core-gateway
          readOnly: true
        # Gateway-owned, region-free liveness/readiness.
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      - name: enforcer
        image: harbor-local.aiplatformdev.freeddns.org/ai-platform/cmp/enforcer:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: enforcer
          containerPort: 8090
        args:
        - -listen=:8090
        - -upstream=http://localhost:8080
        - -cmp-base=http://cmp-backend.cmp.svc.cluster.local
        - -registry=/etc/enforcer/registry.json
        - -access-log=true
        env:
        - name: CMP_ENFORCER_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: pipeline-core-gateway-secrets
              key: enforcer-service-key
        volumeMounts:
        - name: enforcer-registry
          mountPath: /etc/enforcer
          readOnly: true
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8091
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8091
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: regions-config
        configMap:
          name: core-gateway-regions
      - name: enforcer-registry
        configMap:
          name: enforcer-registry
