# Secret for pipeline-core-service gateway.
# Do NOT commit real values here. Populate before applying, or use an
# external secrets manager (Vault, ESO, Sealed Secrets, etc.).
#
# Required keys:
#   database-url  — PostgreSQL DSN, e.g.:
#                   postgres://gateway:password@pg-host:5432/pipeline_gateway?sslmode=require
#   service-key   — Shared secret guarding provisioning + admin endpoints.
#                   Generate with: openssl rand -hex 32
#
# Example (fill in real values and apply with kubectl apply -f secret.yaml):
#   kubectl create secret generic pipeline-core-gateway-secrets \
#     --namespace aiplatform-core-gateway \
#     --from-literal=database-url='postgres://gateway:CHANGE_ME@pg-host:5432/pipeline_gateway' \
#     --from-literal=service-key='CHANGE_ME'
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-core-gateway-secrets
  namespace: aiplatform-core-gateway
type: Opaque
stringData:
  database-url: "CHANGE_ME"
  service-key: "CHANGE_ME"
  # PAT of a UserAccountType.SYSTEM user in CMP — used by the enforcer
  # sidecar to call /internal/authn and /internal/authz.
  # Create via Django shell (see docs for instructions).
  enforcer-service-key: "CHANGE_ME"
