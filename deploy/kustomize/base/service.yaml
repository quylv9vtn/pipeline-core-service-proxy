apiVersion: v1
kind: Service
metadata:
  name: pipeline-core-service
  namespace: aiplatform-core-gateway
  annotations:
    prometheus.io/port: "8080"
    prometheus.io/scheme: http
    prometheus.io/scrape: "true"
spec:
  ports:
  - name: http-internal
    port: 8080
    protocol: TCP
    targetPort: 8080
  - name: http-external
    port: 8090
    protocol: TCP
    targetPort: 8090
  selector:
    app: pipeline-core-service
